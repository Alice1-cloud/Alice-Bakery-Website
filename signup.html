<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account | Alice's Bakery</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #fce3e8;
        color: #30211e;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 30px 20px;
    }

    .signup-container {
        width: 100%;
        max-width: 450px;
    }

    .back-home {
        display: inline-block;
        margin-bottom: 20px;

        color: #a94364;
        text-decoration: none;
        font-weight: bold;
        font-size: 16px;
    }

    .signup-card {
        background: #fffafa;
        border-radius: 28px;
        padding: 40px 30px;

        box-shadow: 0 10px 35px rgba(80, 40, 50, 0.12);
    }

    .logo-text {
        text-align: center;
        color: #a94364;
        font-family: Georgia, serif;
        font-size: 28px;
        margin-bottom: 8px;
    }

    .small-title {
        text-align: center;
        color: #d86686;
        letter-spacing: 3px;
        font-size: 12px;
        margin-bottom: 10px;
    }

    h1 {
        text-align: center;
        font-family: Georgia, serif;
        font-size: 38px;
        margin-bottom: 8px;
        color: #30211e;
    }

    .intro {
        text-align: center;
        color: #6f5b5b;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 28px;
    }

    .flourish {
        text-align: center;
        color: #d85f7d;
        font-size: 20px;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        color: #4a2924;
        font-weight: bold;
        font-size: 14px;
    }

    input {
        width: 100%;
        padding: 14px 15px;

        border: 1px solid #e7b9c5;
        border-radius: 12px;

        background: #fff;
        color: #30211e;
        font-size: 15px;

        outline: none;
    }

    input:focus {
        border-color: #d85f7d;
        box-shadow: 0 0 0 3px rgba(216, 95, 125, 0.12);
    }

    .signup-btn {
        width: 100%;
        border: none;
        border-radius: 25px;

        padding: 15px;
        margin-top: 8px;

        background: #df6d91;
        color: white;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;
    }

    .signup-btn:hover {
        background: #d85f7d;
    }

    .signup-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .message {
        display: none;
        margin-top: 18px;
        padding: 12px;
        border-radius: 10px;

        text-align: center;
        font-size: 14px;
        line-height: 1.5;
    }

    .message.show {
        display: block;
    }

    .message.error {
        background: #fde5e5;
        color: #9b3030;
    }

    .login-text {
        text-align: center;
        margin-top: 25px;

        color: #6f5b5b;
        font-size: 14px;
    }

    .login-text a {
        color: #d85f7d;
        font-weight: bold;
        text-decoration: none;
    }


    /* ==========================================
       SUCCESS POPUP
    ========================================== */

    .success-popup {
        position: fixed;
        inset: 0;

        background: rgba(48, 33, 30, 0.45);

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;

        z-index: 9999;

        animation: popupFadeIn 0.3s ease;
    }

    .success-popup-box {
        position: relative;

        width: 100%;
        max-width: 420px;

        background: #fffafa;

        border-radius: 28px;

        padding: 40px 30px;

        text-align: center;

        box-shadow:
            0 20px 60px rgba(80, 40, 50, 0.25);

        animation: popupScale 0.3s ease;
    }

    .success-popup-close {
        position: absolute;

        top: 15px;
        right: 18px;

        width: 35px;
        height: 35px;

        border: none;
        border-radius: 50%;

        background: #fce3e8;
        color: #a94364;

        font-size: 24px;
        line-height: 35px;

        cursor: pointer;
    }

    .success-popup-close:hover {
        background: #f8d1da;
    }

    .success-heart {
        width: 65px;
        height: 65px;

        margin: 0 auto 18px;

        border-radius: 50%;

        background: #fce3e8;

        display: flex;
        justify-content: center;
        align-items: center;

        color: #df6d91;

        font-size: 30px;
    }

    .success-popup .success-small-title {
        color: #d86686;

        letter-spacing: 2px;

        font-size: 11px;

        margin-bottom: 10px;
    }

    .success-popup h2 {
        font-family: Georgia, serif;

        font-size: 32px;

        color: #30211e;

        margin-bottom: 8px;
    }

    .success-flourish {
        color: #d85f7d;

        font-size: 19px;

        margin-bottom: 18px;
    }

    .success-popup-box > p:not(.success-small-title) {
        color: #6f5b5b;

        font-size: 15px;

        line-height: 1.6;

        margin-bottom: 25px;
    }

    .success-login-btn {
        width: 100%;

        border: none;

        border-radius: 25px;

        padding: 15px 20px;

        background: #df6d91;

        color: white;

        font-size: 14px;

        font-weight: bold;

        letter-spacing: 0.5px;

        cursor: pointer;

        display: flex;

        justify-content: center;

        align-items: center;

        gap: 10px;

        transition: 0.2s ease;
    }

    .success-login-btn:hover {
        background: #d85f7d;
    }

    .success-login-btn span {
        font-size: 20px;
    }

      .password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 50px;
}

.password-toggle {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);

    border: none;
    background: transparent;

    color: #a94364;
    font-size: 18px;

    cursor: pointer;
    padding: 5px;
}


    /* ==========================================
       POPUP ANIMATIONS
    ========================================== */

    @keyframes popupFadeIn {

        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }

    }

    @keyframes popupScale {

        from {
            transform: scale(0.9);
            opacity: 0;
        }

        to {
            transform: scale(1);
            opacity: 1;
        }

    }


    /* ==========================================
       MOBILE
    ========================================== */

    @media (max-width: 480px) {

        body {
            padding: 20px 15px;
        }

        .signup-card {
            padding: 32px 22px;
        }

        h1 {
            font-size: 32px;
        }

        .success-popup-box {
            padding: 35px 22px;
        }

        .success-popup h2 {
            font-size: 28px;
        }

    }

</style>

</head><body><div class="signup-container">

    <a href="index.html" class="back-home">
        ← Back to Home
    </a>


    <div class="signup-card">

        <div class="logo-text">
            Alice's Bakery
        </div>


        <div class="small-title">
            ✦ WELCOME TO OUR BAKERY ✦
        </div>


        <h1>
            Create Your Account
        </h1>


        <p class="intro">
            Create an account to order your favorite cakes
            and keep track of your orders.
        </p>


        <div class="flourish">
            ─── ♡ ───
        </div>


        <form id="signup-form">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="full-name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="full-name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>

        
        <!-- PASSWORD -->

<div class="form-group">

    <label for="password">
        Password
    </label>

    <div class="password-wrapper">

        <input
            type="password"
            id="password"
            placeholder="Create a password"
            minlength="6"
            required
        >

        <button
            type="button"
            class="password-toggle"
            onclick="togglePassword('password', this)"
            aria-label="Show password">

            <i class="fa-solid fa-eye"></i>
            👁️
          
        </button>

    </div>

</div>
          
          <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm-password">
                    Confirm Password
                </label>

                <div class="password-wrapper">

    <input
        type="password"
        id="confirm-password"
        placeholder="Enter your password again"
        minlength="6"
        required
    >

    <button
        type="button"
        class="password-toggle"
        onclick="togglePassword('confirm-password', this)"
        aria-label="Show password">

        👁️

    </button>

</div>

            </div>


            <!-- CREATE ACCOUNT BUTTON -->

            <button
                type="submit"
                class="signup-btn"
                id="signup-btn">

                Create Account

            </button>

        </form>


        <!-- ERROR MESSAGE -->

        <div
            id="message"
            class="message">
        </div>


        <!-- LOGIN -->

        <p class="login-text">

            Already have an account?

            <a href="login.html">
                Log In
            </a>

        </p>

    </div>

</div>


<script>


    // ==========================================
    // SUPABASE CONNECTION
    // ==========================================

    const SUPABASE_URL =
        "https://zhewpkkghepxahfacnlq.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_v4_Vtg2PZR1rGVQ1xyNx8g_ov7ZlW8r";


    const { createClient } = supabase;


    const supabaseClient =
        createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );



    // ==========================================
    // FORM ELEMENTS
    // ==========================================

    const signupForm =
        document.getElementById("signup-form");


    const signupButton =
        document.getElementById("signup-btn");


    const message =
        document.getElementById("message");



    // ==========================================
    // SHOW ERROR MESSAGE
    // ==========================================

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message show " + type;

    }

// ==========================================
// SIGN UP
// ==========================================

signupForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const fullName =
            document
                .getElementById("full-name")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const phone =
            document
                .getElementById("phone")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const confirmPassword =
            document
                .getElementById("confirm-password")
                .value;



        // ==================================
        // CHECK PASSWORDS
        // ==================================

        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;

        }



        // ==================================
        // DISABLE BUTTON
        // ==================================

        signupButton.disabled = true;

        signupButton.textContent =
            "Checking Phone...";



        try {

            // ==================================
            // CHECK IF PHONE ALREADY EXISTS
            // ==================================

            const { data: phoneExists, error: phoneError } =
                await supabaseClient.rpc(
                    "check_phone_exists",
                    {
                        phone_number: phone
                    }
                );


            if (phoneError) {

                throw phoneError;

            }


            // ==================================
            // PHONE ALREADY REGISTERED
            // ==================================

            if (phoneExists === true) {

                showMessage(
                    "This phone number is already registered. Please use another phone number or log in.",
                    "error"
                );

                signupButton.disabled = false;

                signupButton.textContent =
                    "Create Account";

                return;

            }



            // ==================================
            // CREATE ACCOUNT
            // ==================================

            signupButton.textContent =
                "Creating Account...";


            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            full_name: fullName,

                            phone: phone

                        }

                    }

                });



            if (error) {

                throw error;

            }



            // ==================================
            // SUCCESS
            // ==================================

            signupForm.reset();

            showSuccessPopup();



        } catch (error) {

            console.error(
                "Signup error:",
                error
            );


            showMessage(
                error.message ||
                "Something went wrong. Please try again.",
                "error"
            );

        }



        // ==================================
        // ENABLE BUTTON AGAIN
        // ==================================

        signupButton.disabled = false;

        signupButton.textContent =
            "Create Account";

    }
);







    // ==========================================
    // SUCCESS POPUP
    // ==========================================

    function showSuccessPopup() {

        const popup =
            document.createElement("div");


        popup.className =
            "success-popup";


        popup.innerHTML = `

            <div class="success-popup-box">


                <button
                    class="success-popup-close"
                    onclick="goToLogin()"
                    aria-label="Close">

                    ×

                </button>


                <div class="success-heart">

                    ♥

                </div>


                <p class="success-small-title">

                    ✦ WELCOME TO ALICE'S BAKERY ✦

                </p>


                <h2>

                    Account Created!

                </h2>


                <div class="success-flourish">

                    ─── ♡ ───

                </div>


                <p>

                    Your account has been created successfully.
                    You can now sign in and start exploring
                    our delicious cakes.

                </p>


                <button
                    class="success-login-btn"
                    onclick="goToLogin()">

                    CONTINUE TO LOGIN

                    <span>
                        →
                    </span>

                </button>


            </div>

        `;


        document.body.appendChild(popup);

    }



    // ==========================================
    // GO TO LOGIN
    // ==========================================

    function goToLogin() {

        window.location.href =
            "login.html";

    }

      // ==========================================
// SHOW / HIDE PASSWORD
// ==========================================

function togglePassword(inputId, button) {

    const input =
        document.getElementById(inputId);

    if (input.type === "password") {

        input.type = "text";

        button.textContent = "🙈";

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

    } else {

        input.type = "password";

        button.textContent = "👁️";

        button.setAttribute(
            "aria-label",
            "Show password"
        );

    }

}
  
</script>

</body>
</html>
